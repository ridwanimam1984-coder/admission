<style>
:root{--n:#16337a;--o:#d9822b;--bg:#eef2fa;--c:#fff;--t:#14213d;--b:#b9c6e4}
@media(prefers-color-scheme:dark){:root{--bg:#0e1730;--c:#17254a;--t:#e8edfb;--b:#3a4d85}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nirmala UI',sans-serif;background:var(--bg);color:var(--t);padding-bottom:30px}
header{background:var(--n);color:#fff;text-align:center;padding:16px 12px;border-bottom:4px solid var(--o)}
header h1{font-size:1.25rem}header p{font-size:.78rem;opacity:.9;margin-top:3px}
main{max-width:720px;margin:12px auto;padding:0 12px}
.card{background:var(--c);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0003}
.title{text-align:center;background:var(--n);color:#fff;border-radius:8px;padding:8px;font-weight:700;margin:6px 0 14px}
.decl{font-size:.88rem;line-height:1.7;margin-bottom:12px}
h2{font-size:.95rem;color:var(--o);margin:16px 0 10px;border-bottom:2px solid var(--b);padding-bottom:5px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:520px){.g{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:3px}
label b{color:#d33}
input,select,textarea{width:100%;padding:10px;border:2px solid var(--b);border-radius:8px;font:inherit;background:var(--bg);color:var(--t);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--o)}
.radio{display:flex;gap:18px;align-items:center}.radio label{display:flex;gap:6px;align-items:center;margin:0}
.radio input{width:auto}
.terms{background:var(--bg);border:2px dashed var(--o);border-radius:10px;padding:12px;font-size:.86rem}
.terms ol{padding-left:20px;line-height:1.7}
.agree{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-weight:600}.agree input{width:auto;margin-top:5px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--n);color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;margin-top:14px}
button:disabled{opacity:.6}.wa{background:#25d366;display:none}
#msg{margin-top:12px;padding:12px;border-radius:8px;display:none;font-weight:600}
#msg.ok{display:block;background:#d4efdf;color:#145a32}#msg.err{display:block;background:#fadbd8;color:#922b21}
.hp{position:absolute;left:-9999px}
.slip h3{text-align:center;color:var(--n)}.slip .sh{text-align:center;font-size:.85rem;margin-bottom:10px}
.slip table{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}.slip td{border:1px solid var(--b);padding:6px 8px;vertical-align:top}.slip td:first-child{width:38%;font-weight:600}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:46px;text-align:center;font-size:.85rem}
.sig div{border-top:1px solid var(--t);padding-top:6px}.sig img{max-height:60px;display:block;margin:-66px auto 8px}
@media print{header,form,#inst,.noprint{display:none!important}body{background:#fff;color:#000}main{margin:0;max-width:none}.card{box-shadow:none;background:#fff;color:#000}.slip td{border-color:#000}}
</style></head><body>
<header><h1 id="hName"></h1><p id="hAddr"></p><p id="hPh"></p></header>
<main><button id="inst" type="button" class="wa" style="background:#d9822b;margin:0 0 12px">📲 অ্যাপ ইনস্টল করুন</button><form id="f" class="card" novalidate>
<div class="title">ভর্তির আবেদন ফরম</div>
<div class="g">
<div><label>আবেদনের ধরন</label><div class="radio"><label><input type="radio" name="ধরন" value="নতুন" checked> নতুন</label><label><input type="radio" name="ধরন" value="পুরাতন"> পুরাতন</label></div></div>
<div><label>শিক্ষাবর্ষ (ঈসাব্দ / হিজরী)</label><input name="শিক্ষাবর্ষ" placeholder="২০২৬ / ১৪৪৮"></div>
</div>
<p class="decl" style="margin-top:12px">মুহতারাম, বিনীত আরজ, আমি অত্র মাদ্রাসার তালিম তরবিয়্যাতের উপর আকৃষ্ট হয়ে খুলুছিয়্যাতের সাথে নিজের চরিত্র গঠন এবং দ্বীনি ইসলাম শিক্ষা করার উদ্দেশ্যে প্রতিষ্ঠানের সকল নিয়ম কানুন মেনে চলার অঙ্গীকার করে ভর্তি আবেদন করিতেছি।</p>

<h2>আবেদনকারীর তথ্যাবলি</h2>
<div class="g">
<div class="full"><label>আবেদনকারীর নাম <b>*</b></label><input name="আবেদনকারীর_নাম" required></div>
<div><label>জন্ম তারিখ <b>*</b></label><input type="date" id="dob" name="জন্ম_তারিখ" required></div>
<div><label>বয়স</label><input id="age" name="বয়স" readonly placeholder="স্বয়ংক্রিয়"></div>
<div><label>পিতার নাম <b>*</b></label><input name="পিতার_নাম" required></div>
<div><label>পিতার পেশা</label><input name="পিতার_পেশা"></div>
<div class="full"><label>পিতার মোবাইল</label><input type="tel" name="পিতার_মোবাইল" inputmode="numeric"></div>
<div><label>মাতার নাম</label><input name="মাতার_নাম"></div>
<div><label>মাতার পেশা</label><input name="মাতার_পেশা"></div>
<div class="full"><label>মাতার মোবাইল</label><input type="tel" name="মাতার_মোবাইল" inputmode="numeric"></div>
<div class="full"><label>জন্ম নিবন্ধন / NID কার্ডের নম্বর</label><input name="জন্ম_নিবন্ধন_NID" inputmode="numeric"></div>
<div><label>গ্রাম <b>*</b></label><input name="গ্রাম" required></div>
<div><label>ডাকঘর</label><input name="ডাকঘর"></div>
<div><label>থানা <b>*</b></label><input name="থানা" required></div>
<div><label>জেলা <b>*</b></label><input name="জেলা" required></div>
<div class="full"><label>বর্তমান ঠিকানা</label><input name="বর্তমান_ঠিকানা"></div>
<div class="full"><label>অভিভাবকের নাম ও ঠিকানা <b>*</b></label><input name="অভিভাবক_নাম_ঠিকানা" required></div>
<div><label>অভিভাবকের পেশা</label><input name="অভিভাবকের_পেশা"></div>
<div><label>ছাত্রের সাথে সম্পর্ক</label><input name="সম্পর্ক"></div>
<div class="full"><label>অভিভাবকের মোবাইল <b>*</b></label><input type="tel" name="মোবাইল" pattern="01[0-9]{9}" placeholder="01XXXXXXXXX" inputmode="numeric" required></div>
<div class="full"><label>সাবেক শিক্ষা প্রতিষ্ঠানের নাম ও ঠিকানা</label><input name="সাবেক_প্রতিষ্ঠান"></div>
<div class="full"><label>কোন বিভাগে কি পড়েছে</label><input name="পূর্বে_পড়েছে"></div>
<div class="full"><label>কোন বিভাগে ভর্তি হইতে ইচ্ছুক <b>*</b></label>
<select name="ভর্তির_বিভাগ" required><option value="">নির্বাচন করুন</option><option>নূরানী</option><option>হিফজ</option><option>নাজেরা</option><option>ইবতেদায়ী</option><option>মুতাওয়াসসিতা</option><option>সানাবিয়া</option><option>দাওরা</option></select></div>
<div class="full"><label>তালিমী মুরুব্বীর নাম</label><input name="তালিমী_মুরুব্বী"></div>
</div>

<div id="tBox" class="terms" style="margin-top:16px;display:none"><b>শর্তাবলি</b><ol id="tList"></ol>
<label class="agree"><input type="checkbox" id="ag"> আমি উপরের সকল শর্ত পড়েছি ও মেনে নিলাম।</label></div>

<input class="hp" name="_gotcha" tabindex="-1" autocomplete="off">
<button id="sb" type="submit">আবেদন জমা দিন</button>
<button id="wa" type="button" class="wa">WhatsApp-এ পাঠান</button>
<div id="msg"></div>
</form><section id="slip" class="card" style="display:none"></section></main>
<script>

/* ====== অ্যাডমিন: শুধু এই অংশ বদলান ====== */
const CONFIG = {
  "address": "নগরচড়া মধ্য পাড়া, ত্রিশাল, ময়মনসিংহ",
  "officePhone": "+880 1726108887",
  "founderPhone": "+880 1916426957",
  "directorTitle": "পরিচালক",
  "directorName": "মাওঃ মুহাঃ রিদওয়ানুল্লাহ",
  "directorSignature": "",
  "madrasaName": "তারবীয়াতুল উম্মাহ ইসলামি ইনস্টিটিউট",
  "formspreeId": "",
  "whatsapp": "",
  "terms": [
    "প্রতিষ্ঠানের সকল নিয়ম-কানুন মেনে চলতে হবে।",
    "ভর্তির সময় জন্ম নিবন্ধন/NID-এর কপি জমা দিতে হবে।",
    "অনুমতি ছাড়া প্রতিষ্ঠান ত্যাগ করা যাবে না।"
  ]
};
/* ========================================= */
let C=CONFIG;
const $=id=>document.getElementById(id),f=$('f');
init();
function init(){
  $('hName').textContent=C.madrasaName;$('hAddr').textContent=C.address||'';
  $('hPh').textContent=[C.officePhone&&('অফিসিয়াল: '+C.officePhone),C.founderPhone&&('প্রতিষ্ঠাতা: '+C.founderPhone)].filter(Boolean).join(' | '); document.title="ভর্তি ফরম | "+C.madrasaName;
  if(C.terms&&C.terms.length){$('tBox').style.display='block';
    C.terms.forEach(t=>{const li=document.createElement('li');li.textContent=t;$('tList').appendChild(li)})}
  if(C.whatsapp)$('wa').style.display='block';
}
$('dob').onchange=e=>{const d=new Date(e.target.value),n=new Date();
  let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate()))y--;$('age').value=isNaN(y)?'':y+' বছর'};
const show=(t,c)=>{$('msg').textContent=t;$('msg').className=c};
const data=()=>Object.fromEntries(new FormData(f));
const txt=d=>"📋 ভর্তি আবেদন – "+C.madrasaName+"\n\n"+Object.entries(d).filter(([k,v])=>v&&k!=="_gotcha").map(([k,v])=>k.replace(/_/g," ")+": "+v).join("\n");
function ok(){ if(!f.reportValidity())return false;
  if(C.terms&&C.terms.length&&!$('ag').checked){show("অনুগ্রহ করে শর্তে সম্মতি দিন।","err");return false}return true}
$('wa').onclick=()=>{if(ok()){showSlip(data());open("https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(txt(data())),"_blank")}};
f.onsubmit=async e=>{e.preventDefault();if(!ok())return;const d=data();if(d._gotcha)return;
  if(!C.formspreeId){if(C.whatsapp){$('wa').click();return}show("ফরমটি এখনো চালু করা হয়নি। মাদরাসায় যোগাযোগ করুন।","err");return}
  $('sb').disabled=true;$('sb').textContent="জমা হচ্ছে...";
  try{const r=await fetch("https://formspree.io/f/"+C.formspreeId,{method:"POST",headers:{Accept:"application/json","Content-Type":"application/json"},body:JSON.stringify({...d,_subject:"নতুন ভর্তি আবেদন: "+d["আবেদনকারীর_নাম"]})});
    if(!r.ok)throw 0;showSlip(d);f.reset();show("✅ আলহামদুলিল্লাহ! আবেদন জমা হয়েছে। শীঘ্রই যোগাযোগ করা হবে।","ok");scrollTo({top:0,behavior:"smooth"})}
  catch(_){show("❌ জমা হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।","err")}
  $('sb').disabled=false;$('sb').textContent="আবেদন জমা দিন"};


function showSlip(d){
  const s=$('slip');s.textContent='';s.className='card slip';s.style.display='block';
  const el=(t,x,p)=>{const e=document.createElement(t);if(x)e.textContent=x;(p||s).appendChild(e);return e};
  el('h3',C.madrasaName);el('div',[C.address,C.officePhone].filter(Boolean).join(' | ')).className='sh';
  el('h3','ভর্তি আবেদনের কপি');
  const t=el('table');
  Object.entries(d).filter(([k,v])=>v&&k!=='_gotcha').forEach(([k,v])=>{const r=t.insertRow();r.insertCell().textContent=k.replace(/_/g,' ');r.insertCell().textContent=v});
  const r=t.insertRow();r.insertCell().textContent='আবেদনের তারিখ';r.insertCell().textContent=new Date().toLocaleDateString('bn-BD');
  const g=el('div');g.className='sig';
  el('div','আবেদনকারী / অভিভাবকের স্বাক্ষর',g);
  const dv=el('div',null,g);
  if(C.directorSignature){const im=document.createElement('img');im.src=C.directorSignature;im.alt='';dv.appendChild(im)}
  dv.appendChild(document.createTextNode((C.directorTitle||'পরিচালক')+' অনুমোদন স্বাক্ষর'));
  if(C.directorName){dv.appendChild(document.createElement('br'));dv.appendChild(document.createTextNode('('+C.directorName+')'))}
  const b=el('button','🖨️ প্রিন্ট / PDF সেভ করুন');b.className='noprint';b.type='button';b.onclick=()=>print();
  s.scrollIntoView({behavior:'smooth'});
}
